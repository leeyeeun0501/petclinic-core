apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: petclinic-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: petclinic-mysql-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: petclinic-local
  local:
    path: /var/lib/petclinic/mysql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: petclinic
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: petclinic-local
  resources:
    requests:
      storage: 5Gi
