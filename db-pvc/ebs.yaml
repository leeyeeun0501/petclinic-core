apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: petclinic-ebs-gp3
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: petclinic
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: petclinic-ebs-gp3
  resources:
    requests:
      storage: 5Gi
